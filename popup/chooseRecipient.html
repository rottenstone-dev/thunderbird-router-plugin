<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Choose Recipient</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 4px;
      font-size: 9pt;
    }
    button {
      margin: 0;
      display: block;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }
    #error {
      color: red;
    }
    #error span.red { display: none; }
    #error[data-view="red"] span.red { display: revert; }
    p {
      margin: 0;
    }
    div {
      border-radius: 0;
    }
  </style>
</head>
<body>
  <div id="configs"></div>
  <p id="shiftInstruction">Hold Shift to open compose window instead of sending directly.</p>
  <div id="error" data-view="none">
    <span class="red"></span>
  </div>
  <script src="../utils.js"></script>
  <script src="chooseRecipient.js"></script>
</body>
</html>
